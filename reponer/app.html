<title>Reponer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: columna de teléfono con barra superior fija, contenido en tarjetas y navegación inferior de cuatro secciones. */
:root{
  --fondo:#f4f6f5; --sup:#ffffff; --sup2:#edf1ef; --tinta:#10201c; --tenue:#52635c; --linea:#dde5e1;
  --marca:#0a5c4a; --marca2:#0d7059; --suave:#e2f0eb; --sobre:#ffffff;
  --acento:#ffd84a; --sobre-acento:#3a2f00;
  --rojo:#a8231c; --rojo-f:#fbe5e2; --ambar:#7d5200; --ambar-f:#fcedc6; --verde:#14633c; --verde-f:#dbf1e3;
  --heroe:#0a5c4a; --heroe-t:#ffffff; --heroe-s:#bfe0d5; --heroe-l:rgba(255,255,255,.16);
  --sombra:0 1px 2px rgba(16,32,28,.05),0 6px 20px rgba(16,32,28,.06);
  --r:16px; --fuente:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#0b1311; --sup:#141f1c; --sup2:#1b2925; --tinta:#e9f1ee; --tenue:#9db1a9; --linea:#27362f;
  --marca:#41c2a1; --marca2:#5bd3b4; --suave:#143029; --sobre:#04241b;
  --rojo:#ff9d94; --rojo-f:#48201c; --ambar:#ffd27a; --ambar-f:#40300c; --verde:#8adfae; --verde-f:#153926;
  --heroe:#10392f; --heroe-t:#eef7f3; --heroe-s:#9fc7ba; --heroe-l:rgba(255,255,255,.12);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --fondo:#0b1311; --sup:#141f1c; --sup2:#1b2925; --tinta:#e9f1ee; --tenue:#9db1a9; --linea:#27362f;
  --marca:#41c2a1; --marca2:#5bd3b4; --suave:#143029; --sobre:#04241b;
  --rojo:#ff9d94; --rojo-f:#48201c; --ambar:#ffd27a; --ambar-f:#40300c; --verde:#8adfae; --verde-f:#153926;
  --heroe:#10392f; --heroe-t:#eef7f3; --heroe-s:#9fc7ba; --heroe-l:rgba(255,255,255,.12);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.5 var(--fuente);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--fondo)}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:18px;height:18px} .ic.l{width:30px;height:30px} .ic.xl{width:42px;height:42px;stroke-width:1.8}
.col{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra superior */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--fondo);border-bottom:1px solid transparent;transition:border-color .2s}
.barra.sombra{border-bottom-color:var(--linea)}
.barra .col{display:flex;align-items:center;gap:10px;padding-block:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.logo svg{width:30px;height:30px;flex:none}
.negocio{margin-left:auto;color:var(--tenue);font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--sup2);color:var(--tenue);white-space:nowrap}

/* Contenido */
main{display:flex;flex-direction:column;gap:14px;padding-block:6px calc(104px + env(safe-area-inset-bottom,0px))}
#vista{display:flex;flex-direction:column;gap:14px}
#vista>*{animation:entra .28s ease both}
#vista>*:nth-child(2){animation-delay:.03s} #vista>*:nth-child(3){animation-delay:.06s} #vista>*:nth-child(n+4){animation-delay:.09s}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vt{font-size:1.5rem;line-height:1.15;letter-spacing:-.02em;font-weight:800;outline:none}
.sub{color:var(--tenue);font-size:.95rem}
.tarjeta{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden}
.tarjeta.p{padding:16px;display:flex;flex-direction:column;gap:12px}
.tarjeta h2{font-size:1.05rem;line-height:1.25;font-weight:700}
.seccion{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tenue);padding:4px 2px 0}
.nota{color:var(--tenue);font-size:.9rem}
.nota .ic{vertical-align:-3px}

/* Avisos */
.aviso{display:flex;gap:12px;align-items:center;border-radius:var(--r);padding:12px 14px;font-size:.92rem;background:var(--acento);color:var(--sobre-acento)}
.aviso>div{flex:1;min-width:0}
.aviso b{display:block}
.aviso.error{background:var(--rojo-f);color:var(--rojo)}
.aviso .mini{background:rgba(255,255,255,.55);border-color:transparent;color:inherit}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:14px;border:1px solid var(--marca);background:var(--marca);color:var(--sobre);font-weight:700;font-size:1rem;text-decoration:none;transition:transform .08s,background .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--marca2);border-color:var(--marca2)}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--marca)}
.btn.sec:hover{background:var(--suave)}
.btn.suave{background:var(--suave);border-color:transparent;color:var(--marca)}
.btn.pel{background:transparent;border-color:var(--rojo);color:var(--rojo)}
.btn.pel.lleno{background:var(--rojo);color:var(--sup)}
.btn.ancho{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.mini{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 13px;border-radius:11px;border:1px solid var(--linea);background:var(--sup);font-weight:700;font-size:.88rem;white-space:nowrap}
.mini.pri{background:var(--suave);border-color:transparent;color:var(--marca)}
.fila-b{display:flex;gap:10px;flex-wrap:wrap}
.fila-b>*{flex:1 1 140px}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px;border-radius:10px}

/* Etiquetas de estado */
.pill{display:inline-flex;align-items:center;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.agotado{background:var(--rojo-f);color:var(--rojo)} .pedir{background:var(--ambar-f);color:var(--ambar)}
.pronto{background:var(--sup2);color:var(--tinta)} .bien{background:var(--verde-f);color:var(--verde)}
.camino{background:var(--suave);color:var(--marca)} .sin{background:var(--sup2);color:var(--tenue)}

/* Resumen del día */
.heroe{background:var(--heroe);color:var(--heroe-t);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sombra)}
.heroe .fecha{font-size:.85rem;color:var(--heroe-s);font-weight:600}
.heroe .grande{font-size:2.9rem;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.heroe .frase{font-size:1.05rem;font-weight:600}
.heroe .costo{font-size:.95rem;color:var(--heroe-s)}
.heroe .costo b{color:var(--heroe-t);font-variant-numeric:tabular-nums}
.datos{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--heroe-l);padding-top:12px}
.datos div{display:flex;flex-direction:column;gap:1px;min-width:0}
.datos b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.datos span{font-size:.76rem;color:var(--heroe-s)}

/* Tarjeta de proveedor */
.prov-cab{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--suave);color:var(--marca);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex:none}
.prov-cab div{min-width:0;flex:1}
.prov-cab h2{overflow-wrap:anywhere}
.prov-cab small{color:var(--tenue);font-size:.86rem;font-variant-numeric:tabular-nums}
.item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--linea)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .t b{overflow-wrap:anywhere;line-height:1.3}
.item .t small{color:var(--tenue);font-size:.84rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cant{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cant b{display:block;font-size:1.35rem;line-height:1.1;font-weight:800}
.cant small{color:var(--tenue);font-size:.8rem}
.prov-pie{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--linea);background:var(--sup)}
.minimo{margin:0 16px 12px;padding:10px 12px;border-radius:12px;background:var(--ambar-f);color:var(--ambar);font-size:.88rem;font-weight:600}
.ayuda{font-size:.84rem;color:var(--tenue);text-align:center}

/* Estados vacíos */
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:32px 20px}
.vacio .dibujo{width:72px;height:72px;border-radius:22px;background:var(--suave);color:var(--marca);display:flex;align-items:center;justify-content:center}
.vacio h2{font-size:1.15rem}
.vacio p{color:var(--tenue);max-width:32ch}

/* Buscador y campos */
.buscar{position:relative}
.buscar .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tenue)}
.buscar input{padding-left:44px}
label.campo{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600;min-width:0}
label.campo small{font-weight:400;color:var(--tenue)}
input,textarea{width:100%;min-width:0;min-height:50px;padding:12px 14px;border:1.5px solid var(--linea);border-radius:13px;background:var(--sup);font-size:1rem;transition:border-color .15s}
input:focus,textarea:focus{outline:none;border-color:var(--marca)}
input.mal{border-color:var(--rojo)}
textarea{min-height:92px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.campos .todo{grid-column:1/-1}
.error-txt{color:var(--rojo);font-size:.86rem;font-weight:600}

/* Conteo */
.prod-conteo{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--linea)}
.prod-conteo:first-child{border-top:0}
.prod-conteo .cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.prod-conteo .cab b{overflow-wrap:anywhere;line-height:1.3}
.prod-conteo .cab small{color:var(--tenue);font-size:.82rem;white-space:nowrap}
.paso{display:flex;gap:8px;align-items:center}
.paso .lbl{width:56px;font-size:.86rem;font-weight:700;color:var(--tenue)}
.paso button{width:50px;height:50px;border-radius:13px;border:1.5px solid var(--linea);background:var(--sup2);display:flex;align-items:center;justify-content:center;flex:none;transition:transform .08s}
.paso button:active{transform:scale(.94)}
.paso input{text-align:center;font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.enlace{background:none;border:0;color:var(--marca);font-weight:700;font-size:.88rem;padding:6px 0;text-align:left;display:inline-flex;gap:6px;align-items:center}
.contado{border-left:4px solid var(--marca)}
.guardar-bar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--sup);border:1px solid var(--linea);border-radius:18px;box-shadow:var(--sombra);padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px}
.guardar-bar span{flex:1;font-size:.9rem;color:var(--tenue);font-weight:600}

/* Lista de productos */
.fila-prod{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--linea);background:none;text-align:left}
.fila-prod:first-child{border-top:0}
.fila-prod:hover{background:var(--sup2)}
.fila-prod .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fila-prod .t b{overflow-wrap:anywhere;line-height:1.3}
.fila-prod .t small{color:var(--tenue);font-size:.84rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:8px 13px;border-radius:99px;border:1.5px dashed var(--marca);background:transparent;color:var(--marca);font-weight:600;font-size:.88rem}
details summary{cursor:pointer;font-weight:700;color:var(--marca);list-style:none;display:flex;align-items:center;gap:8px}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:12px}

/* Ajustes */
.opciones{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sup2);padding:4px;border-radius:13px}
.opciones button{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:.9rem;color:var(--tenue)}
.opciones button[aria-pressed="true"]{background:var(--sup);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sobre{display:flex;gap:14px;align-items:center}
.sobre svg{width:52px;height:52px;flex:none}
.lista-pasos{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;color:var(--tenue);font-size:.93rem}
.qr-caja{background:#ffffff;border-radius:16px;padding:14px;border:1px solid var(--linea);align-self:center;line-height:0}
.qr-caja svg{width:200px;height:200px;display:block}
.qr-caja.grande{padding:18px;width:100%;max-width:340px}
.qr-caja.grande svg{width:100%;height:auto;aspect-ratio:1}
.enlace-txt{font-weight:700;color:var(--marca);text-align:center;overflow-wrap:anywhere;font-size:.92rem;-webkit-user-select:all;user-select:all}
.privado{display:flex;gap:10px;align-items:flex-start;background:var(--suave);color:var(--marca);border-radius:12px;padding:12px;font-size:.9rem;font-weight:600}

/* Navegación inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sup);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .col{display:grid;grid-template-columns:repeat(4,1fr);padding-block:6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:7px 2px;border-radius:12px;color:var(--tenue);font-size:.74rem;font-weight:700;position:relative}
.tabs button[aria-current="page"]{color:var(--marca)}
.tabs button[aria-current="page"] .ic{stroke-width:2.4}
.tabs .punto{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--rojo);color:var(--sup);font-size:.68rem;display:flex;align-items:center;justify-content:center}

/* Mensaje flotante */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--tinta);color:var(--fondo);padding:11px 16px;border-radius:13px;font-size:.92rem;font-weight:600;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--sombra);animation:sube .22s ease both}
@keyframes sube{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Ventanas y hojas */
#capa{position:fixed;inset:0;z-index:50;background:rgba(8,16,14,.55);display:flex;align-items:flex-end;justify-content:center;animation:aparece .18s ease both}
@keyframes aparece{from{opacity:0}to{opacity:1}}
.hoja{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--sup);border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:hoja .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes hoja{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.hoja h2{font-size:1.25rem;letter-spacing:-.01em}
.hoja:focus,.hoja h2:focus{outline:none}
.hoja-cab{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cerrar{width:42px;height:42px;border-radius:12px;border:0;background:var(--sup2);display:flex;align-items:center;justify-content:center;flex:none}
.bien-paso{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:18px 6px 6px}
.bien-paso .dibujo{width:88px;height:88px;border-radius:26px;background:var(--suave);color:var(--marca);display:flex;align-items:center;justify-content:center}
.bien-paso h2{font-size:1.45rem;letter-spacing:-.02em}
.bien-paso p{color:var(--tenue);max-width:34ch}
.puntos{display:flex;gap:6px;justify-content:center}
.puntos i{width:8px;height:8px;border-radius:99px;background:var(--linea);transition:width .2s,background .2s}
.puntos i.on{width:22px;background:var(--marca)}
@media (min-width:600px){#capa{align-items:center}.hoja{border-radius:22px}}
@media (max-width:380px){.campos{grid-template-columns:1fr}.heroe .grande{font-size:2.5rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Cálculo (no cambiar): el ritmo de venta sale de los conteos ---------- */
function calcular(p,cfg,hoy){
  var c=p.conteos||[], ult=c[c.length-1];
  var extra=p.porRecibir||0;
  var r={estado:'sin',ritmo:null,stock:(ult?ult.stock:0)+extra,cobertura:null,sugerido:0,pasados:ult?Math.max(0,dias(ult.fecha,hoy)):null};
  if(!ult) return r;
  var cons=0,d=0;
  for(var i=Math.max(1,c.length-4);i<c.length;i++){
    var dd=dias(c[i-1].fecha,c[i].fecha); if(dd<=0) continue;
    cons+=Math.max(0,c[i-1].stock+(c[i].recibido||0)-c[i].stock); d+=dd;
  }
  var emp=Math.max(1,p.empaque||1);
  if(d===0){ if(ult.stock+extra<=0){ r.estado='agotado'; r.sugerido=emp; } return r; }
  var ritmo=cons/d; r.ritmo=ritmo;
  var stock=Math.max(0,ult.stock-ritmo*r.pasados)+extra; r.stock=stock;
  r.cobertura=ritmo>0?stock/ritmo:Infinity;
  var espera=(p.entrega||0)+SEGURIDAD;
  if(stock<=0) r.estado='agotado';
  else if(ritmo>0 && stock<=ritmo*espera) r.estado='pedir';
  else if(ritmo>0 && stock<=ritmo*(espera+3)) r.estado='pronto';
  else r.estado='bien';
  if(r.estado==='agotado'||r.estado==='pedir'){
    var falta=ritmo*((p.entrega||0)+cfg.cobertura)-stock;
    r.sugerido=Math.max(emp,Math.ceil(Math.max(0,falta)/emp)*emp);
  }
  return r;
}
/* Un producto ya pedido no se vuelve a sugerir hasta que llegue o se cancele. */
function analizar(p,cfg,hoy){
  var r=calcular(p,cfg,hoy);
  if(p.pendiente){ r.previo=r.estado; r.estado='camino'; r.sugerido=0; r.atraso=dias(p.pendiente.fecha,hoy)-((p.entrega||0)+SEGURIDAD); }
  return r;
}

/* Revisa unos datos guardados o pegados y los deja en una forma segura. Devuelve null si no son datos de Reponer. */
function sanear(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.productos)) return null;
  var reg=objeto(o.registro), vistos={};
  var r={ejemplo:!!o.ejemplo,bodega:typeof o.bodega==='string'?o.bodega:'',tasa:num(o.tasa,0),cobertura:Math.max(1,Math.round(num(o.cobertura,7)))||7,
    telefonos:objeto(o.telefonos),minimos:objeto(o.minimos),catalogos:objeto(o.catalogos),
    registro:{inicio:esFecha(reg.inicio)?reg.inicio:hoyISO(),pedidos:Math.round(num(reg.pedidos,0))},productos:[]};
  o.productos.forEach(function(p){
    if(!p||typeof p.nombre!=='string'||!p.nombre.trim()) return;
    var id=typeof p.id==='string'&&p.id&&!vistos[p.id]?p.id:uid(); vistos[id]=1;
    var q={id:id,nombre:p.nombre.trim(),proveedor:typeof p.proveedor==='string'?p.proveedor.trim():'',costo:num(p.costo,0),entrega:Math.round(num(p.entrega,2)),empaque:Math.max(1,Math.round(num(p.empaque,1))),conteos:[]};
    (Array.isArray(p.conteos)?p.conteos:[]).forEach(function(c){ if(c&&esFecha(c.fecha)&&num(c.stock,null)!==null) q.conteos.push({fecha:c.fecha,stock:num(c.stock,0),recibido:num(c.recibido,0)}); });
    q.conteos.sort(function(a,b){ return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0; });
    if(num(p.porRecibir,0)>0) q.porRecibir=num(p.porRecibir,0);
    if(p.pendiente&&esFecha(p.pendiente.fecha)) q.pendiente={fecha:p.pendiente.fecha,cantidad:num(p.pendiente.cantidad,0)};
    if(typeof p.cat==='string') q.cat=p.cat;
    r.productos.push(q);
  });
  return r;
}

/* Lo que queda es una estimación: se muestra en enteros, salvo en productos que se cuentan con decimales (por peso). */
function restante(x){ var u=x.p.conteos[x.p.conteos.length-1]; if(u&&u.stock!==Math.round(u.stock)) return cant(x.a.stock); return x.a.stock<1?'<1':miles(Math.round(x.a.stock),0); }

function sinTildes(t){ return String(t).toLowerCase().normalize?String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''):String(t).toLowerCase(); }

/* ---------- Acciones ---------- */
function prod(id){ return S.productos.filter(function(x){return x.id===id;})[0]; }
function guardarConteo(){
  var h=hoyISO(), n=0, mal=null;
  S.productos.forEach(function(p){ var b=borrador[p.id]; if(!b||mal) return; var hay=(b.hay||'').trim(), ll=(b.llego||'').trim();
    if(hay===''&&ll!=='') mal={id:p.id,campo:'hay',txt:'Escribe cuántas hay de '+p.nombre+'.'};
    else if(hay!==''&&num(hay,null)===null) mal={id:p.id,campo:'hay',txt:'Revisa el número de '+p.nombre+'.'};
    else if(ll!==''&&num(ll,null)===null) mal={id:p.id,campo:'llego',txt:'Revisa lo que llegó de '+p.nombre+'.'}; });
  if(mal){ filtro.conteo=''; pintar(); var i=$(mal.campo+'-'+mal.id); if(i){ i.classList.add('mal'); i.focus(); } toast(mal.txt,'alerta'); return; }
  S.productos.forEach(function(p){ var b=borrador[p.id]; if(!b||!(b.hay||'').trim()) return;
    var st=num(b.hay,0), rec=num(b.llego,0), u=p.conteos[p.conteos.length-1];
    if(u&&u.fecha>=h){ u.stock=st; u.recibido=(u.recibido||0)+rec; } else p.conteos.push({fecha:h,stock:st,recibido:rec});
    p.porRecibir=0; if(rec>0) delete p.pendiente;
    if(p.conteos.length>60) p.conteos.shift(); n++; });
  if(!n){ toast('Escribe cuántas hay en al menos un producto.','alerta'); return; }
  borrador={}; filtro.conteo=''; var ok=guardar(); tab='pedido'; pintar(true);
  if(ok) toast('Conteo guardado: '+pl(n,'producto','productos'));
}
function paso(t){
  var id=t.dataset.id, campo=t.dataset.campo, d=+t.dataset.d, i=$(campo+'-'+id), p=prod(id); if(!i||!p) return;
  var u=p.conteos[p.conteos.length-1], base=num(i.value,null); if(base===null) base=campo==='hay'&&u?u.stock:0;
  var v=Math.max(0,Math.round((base+d)*10)/10); i.value=String(v).replace('.',','); i.classList.remove('mal'); anotar(i);
}
function anotar(i){
  var id=i.dataset.hay||i.dataset.llego; if(!id) return; var b=borrador[id]=borrador[id]||{};
  if(i.dataset.hay){ b.hay=i.value; var f=i.closest('.prod-conteo'); if(f) f.classList.toggle('contado',!!i.value.trim()); } else b.llego=i.value;
  progreso();
}

  else if(a==='confirmarSi'){ var f=alCerrar; cerrar(); if(f) f(); }
  else if(a==='paso'){ paso(t); }
  else if(a==='verLlego'){ var caja=document.querySelector('[data-llego-caja="'+id+'"]'); if(caja){ caja.hidden=false; t.hidden=true; (borrador[id]=borrador[id]||{}).abierto=true; var il=$('llego-'+id); if(il) il.focus(); } }
  else if(a==='wa'){ enviado[k]=true; setTimeout(function(){ if(tab==='pedido') pintar(); },600); }
  else if(a==='copiar'){ var its=pedidos()[k]; if(its) copiar(mensaje(k,its),'Pedido copiado'); }
  else if(a==='yaPedi'){
    var lista=pedidos()[k]||[], h0=hoyISO(); if(!lista.length) return;
    lista.forEach(function(x){ x.p.pendiente={fecha:h0,cantidad:x.a.sugerido}; });
    S.registro.pedidos++; delete enviado[k]; if(guardar()) toast('Anotado. Cuando llegue, toca “Llegó”.'); pintar();
  }
  else if(a==='llego'||a==='cancelarPed'){
    var pp=prod(id); if(!pp||!pp.pendiente) return;
    if(a==='llego') pp.porRecibir=(pp.porRecibir||0)+pp.pendiente.cantidad; delete pp.pendiente;
    if(guardar()) toast(a==='llego'?'Mercancía sumada. Cuenta el estante cuando puedas.':'Pedido cancelado'); pintar();
  }
  else if(a==='guardarConteo'){ guardarConteo(); }
  else if(a==='nuevo'){ formProducto(null); }
  else if(a==='editar'){ formProducto(id); }
  else if(a==='rapido'){
    S.productos.push({id:uid(),nombre:t.dataset.nombre,proveedor:'',costo:0,entrega:2,empaque:1,conteos:[]});
    S.ejemplo=false; if(guardar()) toast('Agregado: '+t.dataset.nombre); pintar();
  }
  else if(a==='borrar'){
    var pb=prod(id); if(!pb) return;
    confirmar({titulo:'¿Borrar '+pb.nombre+'?',texto:'Se borran también sus conteos. No se puede deshacer.',ok:'Sí, borrar',peligro:true,si:function(){
      S.productos=S.productos.filter(function(p){return p.id!==id;}); delete borrador[id]; if(guardar()) toast('Producto borrado'); pintar(); }});
  }
  else if(a==='borrarTodo'){
    confirmar({titulo:'¿Borrar todos los datos?',texto:'Se borran tus '+pl(S.productos.length,'producto','productos')+', sus conteos y tus ajustes. Si no tienes respaldo, no se pueden recuperar.',ok:'Sí, borrar todo',peligro:true,si:function(){
      S=vacio(); borrador={}; enviado={}; if(guardar()) toast('Datos borrados'); tab='productos'; pintar(true); }});
  }
  else if(a==='empezar'||a==='bienMio'){ cerrar(); escribir(K_BIEN,'1'); S=vacio(); borrador={}; enviado={}; guardar(); tab='productos'; pintar(true); toast('Listo. Agrega tu primer producto.'); }
  else if(a==='bienEjemplo'||a==='bienSaltar'){ cerrar(); escribir(K_BIEN,'1'); }
  else if(a==='bienSig'){ bienvenida(+t.dataset.i); }
  else if(a==='verBienvenida'){ repaso=true; bienvenida(0); }
  else if(a==='catSi'){
    if(!catPendiente) return;
    var nn=aplicarCatalogo(catPendiente.slug,catPendiente.c), nom=catPendiente.c.nombre; catPendiente=null; pintarCatalogo(); limpiarEnlace(); escribir(K_BIEN,'1');
    tab='conteo'; pintar(true); toast(pl(nn,'producto','productos')+' de '+nom+' agregados. Cuenta cuántas tienes.');
  }
  else if(a==='catNo'){ catPendiente=null; pintarCatalogo(); limpiarEnlace(); }
  else if(a==='tema'){ escribir(K_TEMA,t.dataset.tema); aplicarTema(); pintar(); }
  else if(a==='copiarResp'){ copiar(JSON.stringify(S),'Respaldo copiado. Pégalo en un chat tuyo.'); }
  else if(a==='copiarInforme'){ copiar(informe(),'Informe copiado'); }
  else if(a==='copiarEnlace'){ copiar(SITIO,'Enlace copiado'); }
  else if(a==='verQR'){
    abrir('<div class="hoja-cab"><h2>Escanea para abrir Reponer</h2><button class="cerrar" data-acc="cerrar" aria-label="Cerrar" data-foco>'+ic('cerrar')+'</button></div>'+
      '<div class="qr-caja grande"><svg role="img" aria-label="Código QR que abre Reponer"><use href="#i-qr"/></svg></div>'+
      '<p class="sub" style="text-align:center">Apunta la cámara del otro teléfono a este código.</p><p class="enlace-txt">'+SITIO.replace('https://','').replace(/\/$/,'')+'</p>');
  }
  else if(a==='restaurar'){
    var txt=$('respaldo').value.trim(), o=null; try{ o=sanear(JSON.parse(txt)); }catch(e){}
    if(!o){ toast(txt?'Ese texto no es un respaldo de Reponer.':'Pega primero el texto de tu respaldo.','alerta'); return; }
    confirmar({titulo:'¿Restaurar este respaldo?',texto:'Tiene '+pl(o.productos.length,'producto','productos')+'. Reemplaza lo que hay ahora en este teléfono ('+pl(S.productos.length,'producto','productos')+').',ok:'Sí, restaurar',si:function(){
      S=o; borrador={}; enviado={}; var ok=guardar(); tab='pedido'; pintar(true); if(ok) toast('Respaldo restaurado'); }});
  }
});

document.addEventListener('input',function(ev){
  var i=ev.target;
  if(i.dataset.hay||i.dataset.llego){ var limpio=i.value.replace(/[^\d.,]/g,''); if(limpio!==i.value) i.value=limpio; i.classList.remove('mal'); anotar(i); }
  else if(i.id==='buscarConteo'){ filtro.conteo=i.value; filtrar('conteo'); }
  else if(i.id==='buscarProd'){ filtro.productos=i.value; filtrar('productos'); }
  else if(i.classList.contains('mal')) i.classList.remove('mal');
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&!$('capa').hidden&&$('capa').dataset.cerrable){ cerrar(); return; }
  var i=ev.target;
  if(ev.key==='Enter'&&(i.dataset.hay||i.dataset.llego)){
    ev.preventDefault();
    var todos=[].filter.call(document.querySelectorAll('#listaConteo input'),function(x){ return x.offsetParent!==null; }), n=todos.indexOf(i), sig=null;
    for(var j=n+1;j<todos.length;j++){ if(todos[j].dataset.hay){ sig=todos[j]; break; } }
    if(sig){ sig.focus(); sig.select(); } else $('btnGuardarConteo').focus();
  }
});
document.addEventListener('change',function(ev){
  var i=ev.target;
  if(i.dataset.aj){
    if(i.dataset.aj==='bodega') S.bodega=i.value.trim();
    else if(i.dataset.aj==='tasa'){ var ta=i.value.trim()===''?0:num(i.value,null); if(ta===null){ i.classList.add('mal'); toast('Escribe la tasa solo con números.','alerta'); return; } S.tasa=ta; i.value=ta?miles(ta,2):''; }
    else if(i.dataset.aj==='cobertura'){ var co=Math.round(num(i.value,0)); if(co<1||co>60){ i.classList.add('mal'); toast('Escribe un número de días entre 1 y 60.','alerta'); i.value=S.cobertura; return; } S.cobertura=co; i.value=co; }
    if(guardar()) toast('Guardado'); $('negocio').textContent=S.bodega||'';
  }
  else if(i.dataset.tel!==undefined&&i.dataset.tel!==''){ S.telefonos[i.dataset.tel]=i.value.trim(); if(guardar()) toast('Guardado'); }
});
document.addEventListener('submit',function(ev){
  if(ev.target.id!=='fProd') return; ev.preventDefault();
  var id=ev.target.dataset.id, nombre=$('pNombre').value.trim(), err=$('ePNombre');
  var repetido=S.productos.filter(function(x){ return x.id!==id&&x.nombre.toLowerCase()===nombre.toLowerCase(); })[0];
  if(!nombre||repetido){ err.textContent=nombre?'Ya tienes un producto con ese nombre.':'Escribe el nombre del producto.'; err.hidden=false; $('pNombre').classList.add('mal'); $('pNombre').focus(); return; }
  var campos=[['pCosto','El costo'],['pEntrega','Los días'],['pEmp','El empaque']].concat(id?[]:[['pStock','La cantidad']]);
  for(var c=0;c<campos.length;c++){ var el=$(campos[c][0]); if(el.value.trim()!==''&&num(el.value,null)===null){ el.classList.add('mal'); el.focus(); toast(campos[c][1]+' debe ser un número.','alerta'); return; } }
  var d={nombre:nombre,proveedor:$('pProv').value.trim(),costo:num($('pCosto').value,0),entrega:Math.min(60,Math.round(num($('pEntrega').value,2))),empaque:Math.max(1,Math.round(num($('pEmp').value,1)))};
  var msg;
  if(id){ var p=prod(id); if(!p){ cerrar(); return; } var antes=p.proveedor; for(var k in d) p[k]=d[k];
    if(antes&&d.proveedor&&antes!==d.proveedor&&proveedores().indexOf(antes)<0){ if(S.telefonos[antes]&&!S.telefonos[d.proveedor]) S.telefonos[d.proveedor]=S.telefonos[antes]; if(S.minimos[antes]&&!S.minimos[d.proveedor]) S.minimos[d.proveedor]=S.minimos[antes]; }
    msg='Cambios guardados'; }
  else { d.id=uid(); d.conteos=[]; var s=$('pStock').value.trim(); if(s!=='') d.conteos.push({fecha:hoyISO(),stock:num(s,0),recibido:0}); S.productos.push(d); msg='Producto agregado'; }
  S.ejemplo=false; var ok=guardar(); cerrar(); pintar(); if(ok) toast(msg);
});
window.addEventListener('scroll',function(){ $('barra').classList.toggle('sombra',window.scrollY>4); },{passive:true});
function red(){ $('sinRed').hidden=navigator.onLine!==false; }
window.addEventListener('online',red); window.addEventListener('offline',red);

/* ---------- Arranque ---------- */
aplicarTema(); S=cargar(); pintar(); red();
if(habiaDatos) escribir(K_BIEN,'1'); else if(!leer(K_BIEN)){ repaso=false; bienvenida(0); }
try{ iniciarCatalogos(); }catch(e){}
</script>
